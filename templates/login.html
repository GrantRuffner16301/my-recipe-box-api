<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recipe Workshop - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static',
        filename='css/styles.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>RECIPE WORKSHOP</h1>

        <p class="subtitle">
            Secure Recipe Management
        </p>

        <div
            id="error-message"
            class="error-message">
        </div>

        <form id="login-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    class="form-control"
                    type="text"
                    required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    class="form-control"
                    type="password"
                    required>

            </div>

            <button
                type="submit"
                class="login-btn">

                LOGIN

            </button>

        </form>

        <div class="login-link">

            <p>
                Need an account?
            </p>

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>
    <script
        src="{{ url_for('static',
        filename='js/login.js') }}">
    </script>

</body>

</html>
