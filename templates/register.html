<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Recipe Workshop - Register</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static',
        filename='css/styles.css') }}">
</head>

<body>
    <div class="register-container">
        <h1>RECIPE WORKSHOP</h1>
        <p class="subtitle">Create Your Account</p>
        <div
            id="error-message"
            class="error-message">
        </div>

        <div
            id="success-message"
            class="success-message">
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    class="form-control"
                    type="text"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    class="form-control"
                    type="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password" 
                    class="form-control" 
                    type="password" 
                    required>
            </div>
            <button type="submit" class="register-btn">REGISTER</button>
        </form>

        <div class="login-link">
            <p>Already have an account?</p>
            <a href="/">Login Here</a>
        </div>
    </div>

    <script
        src="{{ url_for('static',
        filename='js/register.js') }}">
    </script>

</body>

</html>
